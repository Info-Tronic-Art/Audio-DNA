<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio-DNA VJ 16b — Expanded Layer Details</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1920px; height: 1080px; overflow: hidden;
  background: #0a0a0e; color: #e0e0e0;
  font-family: 'Segoe UI', -apple-system, Arial, sans-serif;
  font-size: 12px;
}

/* ── TOP BAR ── */
.top-bar {
  height: 44px; background: #111118;
  display: flex; align-items: center; padding: 0 12px;
  border-bottom: 1px solid #252530;
  gap: 10px;
}
.logo {
  display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 700; color: #fff;
  letter-spacing: 1px;
}
.logo .dna-icon {
  width: 26px; height: 26px; border-radius: 5px;
  background: linear-gradient(135deg, #00ccff, #7c3aed, #ff2266);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900; color: #fff;
}
.top-sep {
  width: 1px; height: 24px; background: #333340; margin: 0 4px;
}
.bpm-section {
  display: flex; align-items: center; gap: 6px;
}
.bpm-edit-label {
  font-size: 8px; color: #888; text-transform: uppercase; letter-spacing: 1px;
}
.bpm-value {
  font-size: 28px; font-weight: 700; color: #00ff88;
  font-family: 'Courier New', monospace; letter-spacing: 1px;
}
.btn-s {
  padding: 4px 9px; border-radius: 3px; border: 1px solid #444;
  background: #222230; color: #ccc; font-size: 9px; cursor: pointer;
  font-weight: 600; text-transform: uppercase; white-space: nowrap;
}
.btn-s.tap { background: #2a1a3a; border-color: #7c3aed; color: #b388ff; }
.btn-s.resync { background: #1a2a2a; border-color: #00aa66; color: #00ff88; }
.beat-info {
  font-size: 11px; color: #aaa; margin-left: 6px;
  font-family: 'Courier New', monospace;
}
.beat-info strong { color: #ffcc00; }
.room-delay {
  margin-left: auto; font-size: 10px; color: #888;
  background: #1a1a24; padding: 4px 10px; border-radius: 3px;
  border: 1px solid #333;
}
.room-delay span { color: #ffaa00; font-weight: 600; }

/* ── SCENE ROW ── */
.scene-row {
  height: 28px; background: #0e0e14; display: flex; align-items: center;
  padding: 0 12px; border-bottom: 1px solid #1e1e28; gap: 4px;
}
.scene-btn {
  padding: 3px 14px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  border: 1px solid #333; background: #18181f; color: #888;
  border-radius: 2px; cursor: pointer;
}
.scene-btn.active {
  background: #7c3aed; border-color: #9966ff; color: #fff;
  box-shadow: 0 0 8px rgba(124,58,237,0.4);
}
.scene-btn.auto {
  background: #1a2a1a; border-color: #338833; color: #66cc66;
  font-style: italic;
}
.scene-btn.add {
  background: transparent; border: 1px dashed #444; color: #666;
  font-size: 10px;
}

/* ── MAIN LAYOUT ── */
.main-area {
  display: flex; height: calc(1080px - 44px - 28px - 32px);
}

/* ── LEFT: LAYER STRIPS ── */
.layer-panel {
  width: 260px; background: #0c0c12;
  border-right: 1px solid #222230;
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.layer-strip {
  border-bottom: 1px solid #1e1e28;
  padding: 6px 8px;
  background: #101018;
}
.layer-strip:hover { background: #14141e; }
.layer-header {
  display: flex; align-items: center; gap: 5px;
  margin-bottom: 4px;
}
.layer-toggle {
  width: 14px; height: 14px; border-radius: 2px;
  border: 1px solid #555; background: #222;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; color: #888; cursor: pointer;
}
.layer-toggle.on { background: #00cc66; border-color: #00ff88; color: #000; font-weight: 700; }
.layer-mute {
  width: 16px; height: 16px; border-radius: 2px;
  background: #222; border: 1px solid #444;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; color: #888; font-weight: 700;
}
.layer-name {
  font-size: 11px; font-weight: 700; color: #ddd; flex: 1;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.engine-badge {
  font-size: 7px; font-weight: 700; padding: 1px 5px;
  border-radius: 2px; text-transform: uppercase; letter-spacing: 0.5px;
}
.engine-badge.video { background: #1a3a1a; color: #44dd44; border: 1px solid #336633; }
.engine-badge.image { background: #1a2a3a; color: #44aaff; border: 1px solid #335577; }
.engine-badge.synth { background: #2a2a1a; color: #ddcc44; border: 1px solid #555533; }
.layer-detail {
  font-size: 9px; color: #777; margin: 2px 0 2px 20px;
  line-height: 1.5;
}
.layer-detail .label { color: #999; text-transform: uppercase; font-size: 8px; letter-spacing: 0.5px; }
.layer-detail .val { color: #bbb; }
.layer-detail .src { color: #00ccff; }
.layer-meter {
  display: flex; align-items: center; gap: 3px;
  margin: 3px 0 3px 20px;
}
.layer-meter-label { font-size: 8px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
.meter-bars {
  display: flex; gap: 1px; align-items: flex-end; height: 12px;
}
.meter-bar {
  width: 3px; border-radius: 1px 1px 0 0;
}
.layer-opacity {
  display: flex; align-items: center; gap: 6px;
  margin: 3px 0 2px 20px;
}
.layer-opacity-label { font-size: 8px; color: #666; text-transform: uppercase; }
.layer-opacity-val { font-size: 9px; color: #00ff88; font-weight: 600; font-family: 'Courier New', monospace; }
.opacity-track {
  flex: 1; height: 4px; background: #222; border-radius: 2px;
  position: relative; overflow: hidden;
}
.opacity-fill {
  height: 100%; border-radius: 2px;
}

/* ── CENTER: CLIP GRID ── */
.clip-grid-area {
  flex: 1; display: flex; flex-direction: column;
  background: #0a0a10;
}
.grid-header {
  display: flex; height: 24px; border-bottom: 1px solid #222;
  background: #0e0e16;
}
.grid-col-header {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  color: #666; letter-spacing: 1px;
  border-right: 1px solid #1a1a22;
}
.grid-col-header.active {
  color: #7c3aed; background: #14121e;
  border-bottom: 2px solid #7c3aed;
}
.grid-body {
  flex: 1; display: flex;
}
.grid-column {
  flex: 1; display: flex; flex-direction: column;
  border-right: 1px solid #1a1a22;
  padding: 3px;
  gap: 3px;
}
.grid-column.active-col { background: rgba(124,58,237,0.04); }
.clip-cell {
  flex: 1; border-radius: 3px;
  border: 1px solid #252530;
  background: #12121a;
  display: flex; flex-direction: column;
  overflow: hidden;
  position: relative;
  min-height: 0;
}
.clip-cell.active {
  border-color: #7c3aed;
  box-shadow: 0 0 6px rgba(124,58,237,0.3);
}
.clip-thumb {
  flex: 1; display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
.clip-label {
  font-size: 8px; color: #888; text-align: center;
  padding: 2px 4px; background: rgba(0,0,0,0.5);
  position: absolute; bottom: 0; left: 0; right: 0;
}
.clip-label.with-meter {
  display: flex; flex-direction: column; gap: 1px;
}
.clip-meter-row {
  display: flex; gap: 1px; justify-content: center;
  height: 3px;
}
.clip-meter-seg {
  width: 4px; height: 3px; border-radius: 1px;
}
.clip-cell.empty {
  background: #0e0e14; border-color: #1a1a22;
  opacity: 0.5;
}

/* ── RIGHT: SOURCES PANEL ── */
.sources-panel {
  width: 260px; background: #0c0c12;
  border-left: 1px solid #222230;
  display: flex; flex-direction: column;
}
.panel-tabs {
  display: flex; height: 26px; border-bottom: 1px solid #222;
}
.panel-tab {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  color: #666; cursor: pointer; letter-spacing: 0.5px;
  border-bottom: 2px solid transparent;
}
.panel-tab.active {
  color: #00ccff; border-bottom-color: #00ccff;
  background: rgba(0,204,255,0.05);
}
.sources-list {
  flex: 1; overflow-y: auto; padding: 6px;
}
.source-item {
  background: #12121a; border: 1px solid #252530;
  border-radius: 3px; margin-bottom: 5px;
  overflow: hidden;
}
.source-header {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px; cursor: pointer;
}
.source-header:hover { background: #18181f; }
.source-expand {
  font-size: 8px; color: #666; width: 12px;
}
.source-wave-mini {
  width: 40px; height: 20px; position: relative;
}
.source-name {
  font-size: 10px; font-weight: 600; color: #ddd; flex: 1;
}
.source-type-badge {
  font-size: 7px; padding: 1px 5px; border-radius: 2px;
  background: #1a2a2a; color: #00ccaa; border: 1px solid #225544;
  text-transform: uppercase;
}
.source-params {
  padding: 4px 8px 8px 26px;
  border-top: 1px solid #1e1e28;
  background: #0e0e16;
}
.source-param-row {
  display: flex; align-items: center; gap: 6px;
  margin: 4px 0;
}
.source-param-label {
  font-size: 8px; color: #888; text-transform: uppercase;
  width: 40px; letter-spacing: 0.5px;
}
.source-param-track {
  flex: 1; height: 4px; background: #222; border-radius: 2px;
  position: relative; overflow: hidden;
}
.source-param-fill {
  height: 100%; background: linear-gradient(90deg, #00ccaa, #00ffcc);
  border-radius: 2px;
}
.source-param-val {
  font-size: 8px; color: #aaa; font-family: 'Courier New', monospace;
  width: 28px; text-align: right;
}
.source-add {
  padding: 8px; text-align: center;
  border: 1px dashed #333; border-radius: 3px;
  color: #555; font-size: 10px; cursor: pointer;
  margin-bottom: 5px;
}
.source-add:hover { border-color: #00ccff; color: #00ccff; }
.source-hint {
  text-align: center; font-size: 9px; color: #444;
  padding: 6px; font-style: italic;
}

/* ── FOOTER ── */
.footer {
  height: 32px; background: #111118;
  display: flex; align-items: center; padding: 0 12px;
  border-top: 1px solid #252530; gap: 12px;
}
.footer-item {
  font-size: 9px; color: #666; text-transform: uppercase;
  letter-spacing: 0.5px;
}
.footer-item.highlight { color: #aaa; }
.footer-item span { color: #00ccff; font-weight: 600; }
.footer-right {
  margin-left: auto; display: flex; gap: 8px;
}
.footer-btn {
  padding: 3px 10px; font-size: 9px; font-weight: 600;
  text-transform: uppercase; border-radius: 2px;
  border: 1px solid #333; background: #1a1a24; color: #aaa;
  cursor: pointer;
}
.footer-btn:hover { border-color: #555; color: #ddd; }

/* ── CANVAS DRAWING ── */
canvas { display: block; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="logo">
    <div class="dna-icon">A</div>
    Audio-DNA VJ
  </div>
  <div class="top-sep"></div>
  <div class="bpm-section">
    <div style="display:flex;flex-direction:column;align-items:center;margin-right:4px;">
      <div class="bpm-edit-label">Editable BPM</div>
      <div class="bpm-value">128.00</div>
    </div>
    <div class="btn-s tap">TAP</div>
    <div class="btn-s">Nudge-</div>
    <div class="btn-s">Nudge+</div>
    <div class="btn-s resync">RESYNC</div>
  </div>
  <div class="top-sep"></div>
  <div class="beat-info">BAR: <strong>32</strong> &nbsp; BEAT: <strong>1.1</strong></div>
  <div class="room-delay">ROOM DELAY <span>15 ms</span></div>
</div>

<!-- SCENE ROW -->
<div class="scene-row">
  <div class="scene-btn">INTRO</div>
  <div class="scene-btn active">VERSE</div>
  <div class="scene-btn auto">AUTO-FOLLOW</div>
  <div class="scene-btn">DROP</div>
  <div class="scene-btn">OUTRO</div>
  <div class="scene-btn add">+ Add Scene</div>
</div>

<!-- MAIN AREA -->
<div class="main-area">

  <!-- LEFT: LAYER STRIPS -->
  <div class="layer-panel" id="layerPanel"></div>

  <!-- CENTER: CLIP GRID -->
  <div class="clip-grid-area">
    <div class="grid-header">
      <div class="grid-col-header">INTRO</div>
      <div class="grid-col-header active">VERSE</div>
      <div class="grid-col-header">BUILD</div>
      <div class="grid-col-header">DROP</div>
      <div class="grid-col-header">OUTRO</div>
    </div>
    <div class="grid-body" id="gridBody"></div>
  </div>

  <!-- RIGHT: SOURCES PANEL -->
  <div class="sources-panel">
    <div class="panel-tabs">
      <div class="panel-tab active">Sources</div>
      <div class="panel-tab">Layer</div>
      <div class="panel-tab">Clip</div>
    </div>
    <div class="sources-list" id="sourcesList"></div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <div class="footer-item">MASTER SOURCES</div>
  <div class="footer-item highlight">AUDIO PLAYER</div>
  <div class="footer-item">DISPLAY 1: <span>1920x1080 @ 60 FPS</span></div>
  <div class="footer-right">
    <div class="footer-btn">SAVE</div>
    <div class="footer-btn">LOAD</div>
    <div class="footer-btn">HELP / SHORTCUTS</div>
  </div>
</div>

<script>
// ── LAYER STRIPS ──
const layers = [
  { name: 'M LAYER 1', engine: 'VIDEO', engineClass: 'video', clip: 'Abstract_01.mov', mode: 'Loop', src: 'MASTER LFO', opacity: 100, meterLevels: [8,10,7,9,6,5,3], color: '#00ff88' },
  { name: 'M LAYER 2', engine: 'IMAGE', engineClass: 'image', clip: 'Geometry_03.png', mode: 'Still', src: 'KICK DRUM', opacity: 78, meterLevels: [5,7,9,6,4,3,2], color: '#44aaff' },
  { name: 'M LAYER 3', engine: 'SYNTH', engineClass: 'synth', clip: 'WaveGen_Sine', mode: 'Generate', src: 'LFO-SINE', opacity: 55, meterLevels: [3,4,6,8,10,7,5], color: '#ddcc44' },
  { name: 'M LAYER 4', engine: 'VIDEO', engineClass: 'video', clip: 'Tunnel_FX_02.mov', mode: 'PingPong', src: 'LFO-CUSTOM', opacity: 92, meterLevels: [9,8,6,5,7,10,8], color: '#ff6644' },
];

const layerPanel = document.getElementById('layerPanel');
layers.forEach((l, i) => {
  const meterBarsHTML = l.meterLevels.map(v => {
    const h = v + 2;
    const c = v > 7 ? '#00ff88' : v > 4 ? '#88cc44' : '#445544';
    return `<div class="meter-bar" style="height:${h}px;background:${c};"></div>`;
  }).join('');

  layerPanel.innerHTML += `
    <div class="layer-strip">
      <div class="layer-header">
        <div class="layer-toggle on">V</div>
        <div class="layer-mute">M</div>
        <div class="layer-name">${l.name}</div>
        <div class="engine-badge ${l.engineClass}">${l.engine}</div>
      </div>
      <div class="layer-detail">
        <span class="label">Clip:</span> <span class="val">${l.clip}</span> &nbsp;/&nbsp;
        <span class="label">Mode:</span> <span class="val">${l.mode}</span>
      </div>
      <div class="layer-detail">
        <span class="label">Audio Source:</span> <span class="src">${l.src}</span>
      </div>
      <div class="layer-meter">
        <span class="layer-meter-label">Audio Meter</span>
        <div class="meter-bars">${meterBarsHTML}</div>
      </div>
      <div class="layer-opacity">
        <span class="layer-opacity-label">Opacity:</span>
        <div class="opacity-track">
          <div class="opacity-fill" style="width:${l.opacity}%;background:${l.color};"></div>
        </div>
        <span class="layer-opacity-val">${l.opacity}%</span>
      </div>
      <div class="layer-detail" style="font-size:8px;color:#555;margin-top:2px;">
        <span class="label">Blend:</span> <span class="val">Add</span> &nbsp;
        <span class="label">FX:</span> <span class="val">${i === 0 ? 'Ripple, Echo' : i === 1 ? 'Hue Shift' : i === 2 ? 'Glow' : 'Kaleidoscope, Zoom Blur'}</span>
      </div>
    </div>
  `;
});

// ── CLIP GRID ──
const columns = ['intro', 'verse', 'build', 'drop', 'outro'];
const gridBody = document.getElementById('gridBody');

// Clip data: name, type (abstract/wave/geo/empty), hasMeter
const clipData = [
  // INTRO column
  [
    { name: 'CLIP 1', type: 'lines', meter: false },
    { name: 'CLIP 2', type: 'dots', meter: false },
    { name: 'CLIP 3', type: 'circles', meter: false },
    { name: '', type: 'empty', meter: false },
  ],
  // VERSE column (active)
  [
    { name: 'CLIP 1', type: 'waves', meter: true },
    { name: 'CLIP 2', type: 'grid', meter: true },
    { name: 'CLIP 3', type: 'spiral', meter: false },
    { name: 'CLIP 4', type: 'noise', meter: true },
  ],
  // BUILD column
  [
    { name: 'CLIP 1', type: 'chevrons', meter: false },
    { name: 'CLIP 2', type: 'triangles', meter: false },
    { name: '', type: 'empty', meter: false },
    { name: 'CLIP 3', type: 'rings', meter: false },
  ],
  // DROP column
  [
    { name: 'CLIP 1', type: 'explosion', meter: true },
    { name: 'CLIP 2', type: 'stripes', meter: false },
    { name: 'CLIP 3', type: 'fractal', meter: true },
    { name: 'CLIP 4', type: 'blocks', meter: false },
  ],
  // OUTRO column
  [
    { name: 'CLIP 1', type: 'fade', meter: false },
    { name: '', type: 'empty', meter: false },
    { name: 'CLIP 2', type: 'moire', meter: false },
    { name: '', type: 'empty', meter: false },
  ],
];

columns.forEach((col, ci) => {
  const isActive = ci === 1;
  const colDiv = document.createElement('div');
  colDiv.className = 'grid-column' + (isActive ? ' active-col' : '');

  clipData[ci].forEach((clip, ri) => {
    const cell = document.createElement('div');
    cell.className = 'clip-cell' + (clip.type === 'empty' ? ' empty' : '') + (isActive && clip.type !== 'empty' ? ' active' : '');

    if (clip.type !== 'empty') {
      const canvas = document.createElement('canvas');
      canvas.width = 240;
      canvas.height = 160;
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      cell.appendChild(canvas);

      // Draw abstract monochrome thumbnail
      requestAnimationFrame(() => drawThumb(canvas, clip.type, ci, ri));

      let labelHTML = clip.name;
      if (clip.meter) {
        const segs = [4,6,8,5,3].map(v => {
          const c = v > 6 ? '#00cc66' : '#335533';
          return `<div class="clip-meter-seg" style="background:${c};width:${v}px;"></div>`;
        }).join('');
        labelHTML = `<div>${clip.name}</div><div class="clip-meter-row">${segs}</div>`;
        cell.innerHTML += `<div class="clip-label with-meter">${labelHTML}</div>`;
      } else {
        cell.innerHTML += `<div class="clip-label">${clip.name}</div>`;
      }
    }

    colDiv.appendChild(cell);
  });

  gridBody.appendChild(colDiv);
});

function drawThumb(canvas, type, col, row) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0, 0, w, h);

  const seed = col * 7 + row * 13;

  switch(type) {
    case 'waves':
      for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(200,200,220,${0.15 + i * 0.05})`;
        ctx.lineWidth = 1.5;
        for (let x = 0; x < w; x += 2) {
          const y = h/2 + Math.sin(x * 0.03 + i * 0.8 + seed) * (20 + i * 8);
          x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      break;
    case 'lines':
      for (let i = 0; i < 20; i++) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(180,180,200,${0.1 + Math.random()*0.15})`;
        ctx.lineWidth = 1 + Math.random();
        const y1 = Math.random() * h;
        ctx.moveTo(0, y1);
        ctx.lineTo(w, y1 + (Math.random()-0.5)*60);
        ctx.stroke();
      }
      break;
    case 'dots':
      for (let i = 0; i < 60; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = 1 + Math.random() * 4;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(200,200,220,${0.1 + Math.random()*0.2})`;
        ctx.fill();
      }
      break;
    case 'circles':
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(w/2, h/2, 15 + i * 14, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(180,200,220,${0.12 + i*0.04})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      break;
    case 'grid':
      const gs = 18;
      ctx.strokeStyle = 'rgba(150,160,180,0.15)';
      ctx.lineWidth = 0.5;
      for (let x = 0; x < w; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
      for (let y = 0; y < h; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
      // highlight some intersections
      for (let i = 0; i < 12; i++) {
        const gx = Math.floor(Math.random()*w/gs)*gs;
        const gy = Math.floor(Math.random()*h/gs)*gs;
        ctx.fillStyle = 'rgba(200,210,230,0.2)';
        ctx.fillRect(gx, gy, gs, gs);
      }
      break;
    case 'spiral':
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(200,200,220,0.2)';
      ctx.lineWidth = 1.5;
      for (let a = 0; a < Math.PI*8; a += 0.05) {
        const r = a * 4;
        const x = w/2 + Math.cos(a) * r;
        const y = h/2 + Math.sin(a) * r;
        a === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.stroke();
      break;
    case 'noise':
      const imgData = ctx.createImageData(w, h);
      for (let i = 0; i < imgData.data.length; i += 4) {
        const v = Math.random() * 40;
        imgData.data[i] = imgData.data[i+1] = imgData.data[i+2] = v;
        imgData.data[i+3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      break;
    case 'chevrons':
      for (let i = 0; i < 10; i++) {
        ctx.beginPath();
        const cy = 10 + i * 16;
        ctx.moveTo(w/2-60, cy); ctx.lineTo(w/2, cy-8); ctx.lineTo(w/2+60, cy);
        ctx.strokeStyle = `rgba(180,190,210,${0.1+i*0.03})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      break;
    case 'triangles':
      for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        const cx = w/2 + (Math.random()-0.5)*80;
        const cy = h/2 + (Math.random()-0.5)*60;
        const s = 15 + Math.random()*30;
        ctx.moveTo(cx, cy-s); ctx.lineTo(cx-s, cy+s*0.6); ctx.lineTo(cx+s, cy+s*0.6);
        ctx.closePath();
        ctx.strokeStyle = `rgba(180,190,210,${0.1+Math.random()*0.15})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      break;
    case 'rings':
      for (let i = 0; i < 5; i++) {
        const cx = w/2 + (Math.random()-0.5)*40;
        const cy = h/2 + (Math.random()-0.5)*30;
        ctx.beginPath();
        ctx.arc(cx, cy, 20+i*12, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(160,170,200,${0.08+i*0.04})`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      break;
    case 'explosion':
      for (let i = 0; i < 30; i++) {
        const angle = Math.random() * Math.PI * 2;
        const len = 20 + Math.random() * 80;
        ctx.beginPath();
        ctx.moveTo(w/2, h/2);
        ctx.lineTo(w/2 + Math.cos(angle)*len, h/2 + Math.sin(angle)*len);
        ctx.strokeStyle = `rgba(220,220,240,${0.08+Math.random()*0.15})`;
        ctx.lineWidth = 1 + Math.random()*2;
        ctx.stroke();
      }
      break;
    case 'stripes':
      for (let i = 0; i < 20; i++) {
        ctx.fillStyle = i%2 === 0 ? 'rgba(30,30,40,1)' : 'rgba(50,50,65,1)';
        ctx.fillRect(0, i*h/20, w, h/20);
      }
      break;
    case 'fractal':
      // Simple recursive tree
      function branch(x, y, len, angle, depth) {
        if (depth === 0 || len < 2) return;
        const nx = x + Math.cos(angle) * len;
        const ny = y - Math.sin(angle) * len;
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(nx, ny);
        ctx.strokeStyle = `rgba(180,190,210,${0.05 + depth*0.04})`;
        ctx.lineWidth = depth * 0.5;
        ctx.stroke();
        branch(nx, ny, len*0.7, angle+0.5, depth-1);
        branch(nx, ny, len*0.7, angle-0.4, depth-1);
      }
      branch(w/2, h-10, 40, Math.PI/2, 8);
      break;
    case 'blocks':
      for (let i = 0; i < 15; i++) {
        const bw = 20 + Math.random()*40;
        const bh = 10 + Math.random()*30;
        const bx = Math.random() * (w-bw);
        const by = Math.random() * (h-bh);
        ctx.fillStyle = `rgba(${140+Math.random()*40},${140+Math.random()*40},${160+Math.random()*40},${0.1+Math.random()*0.12})`;
        ctx.fillRect(bx, by, bw, bh);
      }
      break;
    case 'fade':
      const grd = ctx.createLinearGradient(0, 0, w, h);
      grd.addColorStop(0, 'rgba(40,40,50,0.8)');
      grd.addColorStop(1, 'rgba(10,10,15,0.8)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, w, h);
      // Some soft shapes
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.arc(w*0.3+i*30, h*0.5, 20+i*5, 0, Math.PI*2);
        ctx.fillStyle = `rgba(160,160,180,${0.04+i*0.02})`;
        ctx.fill();
      }
      break;
    case 'moire':
      for (let i = 0; i < 30; i++) {
        ctx.beginPath();
        ctx.arc(w*0.4, h*0.5, 5+i*6, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(170,170,190,${0.06+i*0.01})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
      for (let i = 0; i < 30; i++) {
        ctx.beginPath();
        ctx.arc(w*0.6, h*0.5, 5+i*6, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(170,170,190,${0.06+i*0.01})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
      break;
  }
}

// ── SOURCES PANEL ──
const sourcesList = document.getElementById('sourcesList');

const sources = [
  {
    name: 'KICK DRUM', type: 'Audio', waveType: 'kick', expanded: true,
    params: [{ name: 'Rate', val: 72 }, { name: 'Depth', val: 45 }]
  },
  {
    name: 'LFO-SINE', type: 'LFO', waveType: 'sine', expanded: false,
    params: [{ name: 'Rate', val: 60 }, { name: 'Depth', val: 80 }]
  },
  {
    name: 'LFO-CUSTOM', type: 'LFO', waveType: 'custom', expanded: true,
    params: [{ name: 'Rate', val: 35 }, { name: 'Depth', val: 62 }]
  },
];

sources.forEach((s, si) => {
  const canvasId = `srcWave_${si}`;
  let paramsHTML = '';
  if (s.expanded) {
    const rows = s.params.map(p => `
      <div class="source-param-row">
        <span class="source-param-label">${p.name}</span>
        <div class="source-param-track">
          <div class="source-param-fill" style="width:${p.val}%;"></div>
        </div>
        <span class="source-param-val">${p.val}%</span>
      </div>
    `).join('');
    paramsHTML = `<div class="source-params">${rows}</div>`;
  }

  sourcesList.innerHTML += `
    <div class="source-item">
      <div class="source-header">
        <span class="source-expand">${s.expanded ? '&#9660;' : '&#9654;'}</span>
        <canvas id="${canvasId}" width="80" height="30" style="width:40px;height:20px;border-radius:2px;"></canvas>
        <span class="source-name">${s.name}</span>
        <span class="source-type-badge">${s.type}</span>
      </div>
      ${paramsHTML}
    </div>
  `;
});

// Add source button and hint
sourcesList.innerHTML += `
  <div class="source-add">+ Add Audio Source</div>
  <div class="source-hint">Drag a source onto a parameter</div>
`;

// Draw source waveforms
sources.forEach((s, si) => {
  const canvas = document.getElementById(`srcWave_${si}`);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, w, h);

  ctx.beginPath();
  ctx.strokeStyle = '#00ccaa';
  ctx.lineWidth = 1.5;

  for (let x = 0; x < w; x++) {
    let y;
    const t = x / w;
    switch(s.waveType) {
      case 'kick':
        // Spike + decay
        if (t < 0.15) y = h/2 - (t/0.15) * h * 0.4;
        else y = h/2 - Math.exp(-(t-0.15)*8) * h * 0.4 * Math.sin((t-0.15)*30);
        break;
      case 'sine':
        y = h/2 + Math.sin(t * Math.PI * 4) * h * 0.35;
        break;
      case 'custom':
        // Sawtooth + wobble
        const saw = ((t * 3) % 1) * 2 - 1;
        y = h/2 + (saw + Math.sin(t * Math.PI * 8) * 0.3) * h * 0.3;
        break;
      default:
        y = h/2;
    }
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Fill under the wave
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,204,170,0.08)';
  ctx.fill();
});
