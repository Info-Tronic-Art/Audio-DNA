<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio-DNA VJ 18 Updated — Broadcast Style</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
.app { width: 1920px; height: 1080px; background: #0d0d0d; position: relative; overflow: hidden; display: flex; flex-direction: column; }

/* ===== MENU BAR ===== */
.menu-bar { height: 24px; background: linear-gradient(to bottom, #1e1e1e, #161616); border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; padding: 0 8px; gap: 0; flex-shrink: 0; }
.menu-item { color: #b0b0b0; font-size: 11px; padding: 2px 10px; cursor: pointer; letter-spacing: 0.2px; }
.menu-item:first-child { color: #00ccff; font-weight: 700; }
.menu-item:hover { background: #2a2a2a; color: #e0e0e0; }

/* ===== TOP BAR ===== */
.top-bar { height: 44px; background: linear-gradient(to bottom, #151515, #111); border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; padding: 0 12px; gap: 10px; flex-shrink: 0; }
.logo { font-size: 15px; font-weight: 700; color: #00ccff; letter-spacing: 1px; margin-right: 4px; }
.logo span { color: #666; font-weight: 400; }
.bpm-display { background: #1a1a1a; border: 1px solid #333; padding: 3px 12px; display: flex; align-items: baseline; gap: 5px; }
.bpm-value { font-size: 20px; font-weight: 700; color: #00ff88; font-variant-numeric: tabular-nums; }
.bpm-label { font-size: 9px; color: #666; text-transform: uppercase; }
.top-btn { background: #1c1c1c; border: 1px solid #3a3a3a; color: #bbb; padding: 3px 9px; font-size: 10px; cursor: pointer; text-transform: uppercase; font-weight: 600; }
.top-btn:hover { background: #2a2a2a; color: #ddd; }
.top-btn.active { background: #00ccff; color: #000; border-color: #00ccff; }
.top-btn.warn { background: #332200; border-color: #664400; color: #ffcc00; }
.bar-info { color: #888; font-size: 11px; font-variant-numeric: tabular-nums; }
.bar-info strong { color: #e0e0e0; }
.beat-indicator { display: flex; gap: 2px; align-items: center; }
.beat-dot { width: 24px; height: 9px; }
.beat-dot.b1 { background: #ff3366; }
.beat-dot.b2 { background: #ff9900; }
.beat-dot.b3 { background: #00ccff; }
.beat-dot.b4 { background: #00ff88; }
.top-sep { width: 1px; height: 24px; background: #2a2a2a; }
.quantize-group { display: flex; align-items: center; gap: 4px; }
.quant-label { font-size: 9px; color: #666; text-transform: uppercase; font-weight: 600; }
.quant-select { background: #1a1a1a; border: 1px solid #3a3a3a; color: #ccc; font-size: 10px; padding: 2px 6px; font-family: inherit; }
.top-spacer { flex: 1; }
.fade-group { display: flex; align-items: center; gap: 4px; }
.fade-label { font-size: 9px; color: #666; text-transform: uppercase; font-weight: 600; }
.fade-val { font-size: 11px; color: #ccc; font-weight: 600; }
.lock-btn { background: #331a00; border: 1px solid #664400; color: #ffcc00; padding: 3px 10px; font-size: 10px; cursor: pointer; font-weight: 700; text-transform: uppercase; }

/* ===== SIGNAL BAR ===== */
.signal-bar { height: 40px; background: linear-gradient(to bottom, #0f0f0f, #0c0c0c); border-bottom: 1px solid #1e1e1e; display: flex; align-items: center; padding: 0 10px; gap: 3px; flex-shrink: 0; }
.signal-meter { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 2px 1px; }
.signal-meter-label { font-size: 7px; color: #555; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; }
.signal-meter-bar { width: 100%; height: 14px; background: #111; border: 1px solid #222; position: relative; overflow: hidden; }
.signal-meter-fill { position: absolute; left: 0; top: 0; bottom: 0; }
.signal-meter-value { font-size: 7px; color: #777; font-variant-numeric: tabular-nums; }

/* ===== DECK TABS ===== */
.deck-tabs { height: 26px; background: #0a0a0a; border-bottom: 1px solid #222; display: flex; align-items: stretch; padding: 0 10px; gap: 0; flex-shrink: 0; }
.deck-tab { padding: 0 18px; display: flex; align-items: center; font-size: 11px; font-weight: 600; color: #777; cursor: pointer; border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.5px; }
.deck-tab:hover { color: #aaa; background: #111; }
.deck-tab.active { color: #00ccff; border-bottom-color: #00ccff; background: #0e1418; }
.deck-tab.add { color: #555; font-size: 13px; padding: 0 12px; }
.deck-tab.add:hover { color: #00ccff; }
.scene-row-inner { display: flex; align-items: center; gap: 6px; margin-left: 20px; }
.scene-btn { background: #1a1a1a; border: 1px solid #333; color: #aaa; padding: 3px 14px; font-size: 10px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: 600; text-transform: uppercase; }
.scene-btn .play-icon { font-size: 8px; color: #666; }
.scene-btn.active { background: #1a3322; border-color: #00ff88; color: #00ff88; }
.scene-btn.active .play-icon { color: #00ff88; }
.deck-spacer { flex: 1; }

/* ===== MAIN CONTENT ===== */
.main-content { flex: 1; display: flex; overflow: hidden; }

/* ===== LAYER AREA ===== */
.layer-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.layer-strip { display: flex; align-items: stretch; border-bottom: 1px solid #1a1a1a; flex: 1; min-height: 0; }
.layer-strip:nth-child(odd) { background: #0e0e0e; }
.layer-strip:nth-child(even) { background: #0b0b0b; }

.layer-header { width: 90px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 4px; border-right: 1px solid #222; flex-shrink: 0; gap: 2px; }
.layer-name { font-size: 11px; font-weight: 700; color: #e0e0e0; }
.layer-type-badge { font-size: 8px; padding: 1px 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
.layer-type-badge.opaque { background: #1a2233; color: #4488cc; border: 1px solid #335588; }
.layer-type-badge.transparent { background: #1a2a1a; color: #55aa55; border: 1px solid #337733; }
.layer-type-badge.fxonly { background: #2a1a2a; color: #aa55aa; border: 1px solid #773377; }
.layer-type-badge.mask { background: #2a2a1a; color: #aaaa55; border: 1px solid #777733; }
.layer-controls { display: flex; gap: 3px; margin-top: 2px; }
.layer-ctrl-btn { font-size: 8px; padding: 1px 5px; cursor: pointer; border: 1px solid #333; background: #1a1a1a; color: #888; font-weight: 700; }
.layer-ctrl-btn.solo-on { background: #ccaa00; color: #000; border-color: #ccaa00; }
.layer-ctrl-btn.mute-on { background: #cc3333; color: #fff; border-color: #cc3333; }
.layer-signal-tri { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 6px solid #00ccff; margin-top: 2px; opacity: 0.6; }
.layer-lock-icon { font-size: 8px; color: #555; margin-top: 1px; }

.clip-grid { display: flex; gap: 5px; padding: 6px; flex: 1; overflow-x: auto; }

.clip-cell { width: 140px; min-width: 140px; display: flex; flex-direction: column; background: #141414; border: 1px solid #2a2a2a; cursor: pointer; overflow: hidden; }
.clip-cell.active { border-color: #00ccff; box-shadow: 0 0 8px rgba(0,204,255,0.3); }
.clip-thumb { height: 80px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.clip-thumb canvas { width: 100%; height: 100%; }
.clip-badge { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,0.75); color: #aaa; font-size: 7px; padding: 1px 4px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
.clip-fx-count { position: absolute; bottom: 3px; right: 3px; background: rgba(0,204,255,0.2); color: #00ccff; font-size: 7px; padding: 1px 4px; font-weight: 700; }
.clip-info { padding: 3px 5px; display: flex; flex-direction: column; gap: 1px; }
.clip-name { font-size: 9px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clip-retrigger { font-size: 8px; color: #666; background: #1a1a1a; border: 1px solid #2a2a2a; padding: 1px 5px; text-align: center; cursor: pointer; }
.clip-retrigger:hover { color: #00ccff; border-color: #00ccff; }

/* ===== INSPECTOR PANEL ===== */
.inspector-panel { width: 280px; background: #0e0e0e; border-left: 1px solid #222; display: flex; flex-direction: column; flex-shrink: 0; }
.inspector-tabs { height: 26px; display: flex; border-bottom: 1px solid #222; background: #111; flex-shrink: 0; }
.inspector-tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #666; cursor: pointer; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 2px solid transparent; }
.inspector-tab:hover { color: #aaa; }
.inspector-tab.active { color: #00ccff; border-bottom-color: #00ccff; }
.inspector-body { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.insp-section { background: #121212; border: 1px solid #1e1e1e; padding: 6px; }
.insp-section-title { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between; }
.insp-section-title .collapse { color: #555; cursor: pointer; font-size: 8px; }

/* Dashboard Knobs */
.dashboard-knobs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.dash-knob { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.dash-knob-circle { width: 36px; height: 36px; border-radius: 50%; position: relative; border: 2px solid #333; }
.dash-knob-circle::after { content: ''; position: absolute; top: 50%; left: 50%; width: 22px; height: 22px; background: #1a1a1a; border-radius: 50%; transform: translate(-50%,-50%); }
.dash-knob-label { font-size: 7px; color: #777; text-transform: uppercase; text-align: center; line-height: 1.1; }

/* Effect Stack */
.fx-stack-item { display: flex; align-items: center; gap: 4px; padding: 3px 4px; background: #161616; border: 1px solid #222; margin-bottom: 2px; }
.fx-bypass { width: 10px; height: 10px; background: #00ccff; border: 1px solid #0088aa; cursor: pointer; }
.fx-bypass.off { background: #333; border-color: #444; }
.fx-name { font-size: 9px; color: #ccc; flex: 1; }
.fx-signal-tri { width: 0; height: 0; border-left: 3px solid transparent; border-right: 3px solid transparent; border-bottom: 5px solid #00ccff; cursor: pointer; }
.fx-signal-tri.inactive { border-bottom-color: #444; }
.fx-delete { color: #555; font-size: 9px; cursor: pointer; }
.fx-delete:hover { color: #ff4444; }
.fx-param-row { display: flex; align-items: center; gap: 4px; padding: 2px 4px 2px 18px; }
.fx-param-label { font-size: 8px; color: #777; width: 50px; }
.fx-param-slider { flex: 1; height: 4px; background: #222; position: relative; cursor: pointer; }
.fx-param-fill { position: absolute; left: 0; top: 0; bottom: 0; background: #00ccff; }
.fx-param-value { font-size: 8px; color: #999; width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
.fx-param-tri { width: 0; height: 0; border-left: 3px solid transparent; border-right: 3px solid transparent; border-bottom: 5px solid #444; cursor: pointer; }

/* Cuepoints */
.cuepoint-row { display: flex; gap: 3px; }
.cuepoint-btn { flex: 1; padding: 3px 0; text-align: center; font-size: 8px; font-weight: 700; background: #1a1a1a; border: 1px solid #333; color: #888; cursor: pointer; }
.cuepoint-btn.set { border-color: #ffaa00; color: #ffaa00; background: #1a1500; }

/* Autopilot */
.autopilot-row { display: flex; align-items: center; gap: 6px; }
.autopilot-toggle { width: 28px; height: 14px; background: #333; border: 1px solid #444; position: relative; cursor: pointer; }
.autopilot-toggle.on { background: #00663a; border-color: #00ff88; }
.autopilot-toggle.on::after { content: ''; position: absolute; right: 2px; top: 2px; width: 8px; height: 8px; background: #00ff88; }
.autopilot-toggle::after { content: ''; position: absolute; left: 2px; top: 2px; width: 8px; height: 8px; background: #666; }
.autopilot-label { font-size: 9px; color: #999; }

/* Transform */
.transform-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.transform-field { display: flex; align-items: center; gap: 3px; }
.transform-label { font-size: 8px; color: #666; width: 14px; text-align: right; }
.transform-input { background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc; font-size: 9px; padding: 2px 4px; width: 100%; font-family: inherit; text-align: center; }

/* Keying */
.keying-row { display: flex; align-items: center; gap: 6px; }
.keying-select { background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc; font-size: 9px; padding: 2px 4px; flex: 1; font-family: inherit; }

/* Feedback */
.feedback-row { display: flex; align-items: center; gap: 4px; }
.feedback-preset { background: #1a1a1a; border: 1px solid #2a2a2a; color: #aaa; font-size: 8px; padding: 2px 6px; cursor: pointer; text-align: center; }
.feedback-preset.active { border-color: #00ccff; color: #00ccff; }

/* ===== BROWSER PANEL ===== */
.browser-panel { width: 200px; background: #0e0e0e; border-left: 1px solid #222; display: flex; flex-direction: column; flex-shrink: 0; }
.browser-tabs { height: 26px; display: flex; border-bottom: 1px solid #222; background: #111; flex-shrink: 0; }
.browser-tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #666; cursor: pointer; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 2px solid transparent; }
.browser-tab:hover { color: #aaa; }
.browser-tab.active { color: #00ccff; border-bottom-color: #00ccff; }
.browser-search { margin: 6px; }
.browser-search input { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc; font-size: 10px; padding: 4px 6px; font-family: inherit; }
.browser-search input::placeholder { color: #555; }
.browser-body { flex: 1; overflow-y: auto; padding: 0 6px 6px; }
.browser-category { margin-bottom: 4px; }
.browser-cat-title { font-size: 8px; color: #555; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; padding: 3px 0; border-bottom: 1px solid #1a1a1a; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
.browser-cat-title .count { color: #444; font-weight: 400; }
.browser-item { font-size: 9px; color: #aaa; padding: 2px 6px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.browser-item:hover { background: #1a1a1a; color: #ddd; }
.browser-item .drag-handle { color: #444; font-size: 8px; }

/* ===== FADER STRIP ===== */
.fader-strip { height: 200px; background: linear-gradient(to bottom, #0a0a0a, #080808); border-top: 1px solid #222; display: flex; align-items: stretch; padding: 6px 90px 6px 90px; gap: 0; flex-shrink: 0; }
.fader-column { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 3px 6px; border-right: 1px solid #1a1a1a; }
.fader-column:last-child { border-right: none; }
.fader-col-label { font-size: 8px; color: #888; text-transform: uppercase; font-weight: 600; }
.fader-track { width: 8px; flex: 1; background: #1a1a1a; position: relative; border: 1px solid #2a2a2a; }
.fader-fill { position: absolute; bottom: 0; left: 0; right: 0; }
.fader-handle { position: absolute; left: -7px; right: -7px; height: 12px; background: #555; border: 1px solid #888; }
.fader-value { font-size: 9px; color: #ccc; font-weight: 700; font-variant-numeric: tabular-nums; }
.flash-btn { background: #331a00; border: 1px solid #664400; color: #ffaa00; padding: 3px 10px; font-size: 9px; cursor: pointer; font-weight: 700; text-transform: uppercase; }
.flash-btn:hover { background: #553300; }

/* ===== FOOTER ===== */
.footer { height: 28px; background: linear-gradient(to bottom, #131313, #0e0e0e); border-top: 1px solid #2a2a2a; display: flex; align-items: center; padding: 0 10px; gap: 8px; flex-shrink: 0; }
.footer-section { display: flex; align-items: center; gap: 4px; }
.footer-sep { width: 1px; height: 16px; background: #2a2a2a; }
.footer-label { color: #555; font-size: 9px; }
.footer-value { color: #888; font-size: 10px; font-variant-numeric: tabular-nums; }
.footer-value.good { color: #00ff88; }
.footer-value.warn { color: #ffaa00; }
.footer-value.recording { color: #ff3333; }
.footer-spacer { flex: 1; }
.footer-action { background: #1a1a1a; border: 1px solid #333; color: #aaa; padding: 2px 8px; font-size: 9px; cursor: pointer; font-weight: 600; }
.footer-action:hover { color: #ddd; background: #222; }
.footer-action.rec { background: #330000; border-color: #660000; color: #ff4444; }
.footer-action.rec.on { background: #440000; border-color: #ff3333; color: #ff3333; animation: recBlink 1s infinite; }
@keyframes recBlink { 50% { opacity: 0.5; } }
</style>
</head>
<body>
<div class="app">

  <!-- MENU BAR -->
  <div class="menu-bar">
    <div class="menu-item">Audio-DNA</div>
    <div class="menu-item">Composition</div>
    <div class="menu-item">Deck</div>
    <div class="menu-item">Layer</div>
    <div class="menu-item">Column</div>
    <div class="menu-item">Clip</div>
    <div class="menu-item">Output</div>
    <div class="menu-item">Shortcuts</div>
    <div class="menu-item">View</div>
  </div>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="logo">AUDIO-DNA <span>VJ</span></div>
    <div class="bpm-display">
      <span class="bpm-value">128.00</span>
      <span class="bpm-label">BPM</span>
    </div>
    <button class="top-btn">Tap</button>
    <button class="top-btn">Nudge -</button>
    <button class="top-btn">Nudge +</button>
    <button class="top-btn active">Resync</button>
    <div class="top-sep"></div>
    <div class="bar-info"><strong>Bar 32</strong> &nbsp;1.1</div>
    <div class="beat-indicator">
      <div class="beat-dot b1"></div>
      <div class="beat-dot b2"></div>
      <div class="beat-dot b3"></div>
      <div class="beat-dot b4"></div>
    </div>
    <div class="top-sep"></div>
    <div class="quantize-group">
      <span class="quant-label">Quantize</span>
      <select class="quant-select">
        <option>1 Bar</option>
        <option>2 Bars</option>
        <option>4 Bars</option>
        <option selected>Beat</option>
        <option>Off</option>
      </select>
    </div>
    <div class="fade-group">
      <span class="fade-label">Fade</span>
      <span class="fade-val">0.5s</span>
    </div>
    <div class="top-spacer"></div>
    <button class="top-btn warn">Manual</button>
    <button class="lock-btn">Lock Interface</button>
  </div>

  <!-- SIGNAL BAR -->
  <div class="signal-bar" id="signalBar">
    <!-- Generated by JS -->
  </div>

  <!-- DECK TABS + SCENES -->
  <div class="deck-tabs">
    <div class="deck-tab active">Deck 1</div>
    <div class="deck-tab">Deck 2</div>
    <div class="deck-tab">Deck 3</div>
    <div class="deck-tab add">+</div>
    <div class="deck-spacer"></div>
    <div class="scene-row-inner">
      <button class="scene-btn"><span class="play-icon">&#9654;</span> Intro</button>
      <button class="scene-btn active"><span class="play-icon">&#9654;</span> Verse 1</button>
      <button class="scene-btn"><span class="play-icon">&#9654;</span> Build</button>
      <button class="scene-btn"><span class="play-icon">&#9654;</span> Drop</button>
      <button class="scene-btn"><span class="play-icon">&#9654;</span> Outro</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <!-- LAYER AREA -->
    <div class="layer-area" id="layerArea">
      <!-- Layers generated by JS -->
    </div>

    <!-- INSPECTOR PANEL -->
    <div class="inspector-panel">
      <div class="inspector-tabs">
        <div class="inspector-tab active">Clip</div>
        <div class="inspector-tab">Layer</div>
        <div class="inspector-tab">Composition</div>
        <div class="inspector-tab">Signal</div>
      </div>
      <div class="inspector-body" id="inspectorBody">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- BROWSER PANEL -->
    <div class="browser-panel">
      <div class="browser-tabs">
        <div class="browser-tab active">Files</div>
        <div class="browser-tab">Effects</div>
        <div class="browser-tab">Sources</div>
      </div>
      <div class="browser-search"><input type="text" placeholder="Search..."></div>
      <div class="browser-body" id="browserBody">
        <!-- Generated by JS -->
      </div>
    </div>
  </div>

  <!-- FADER STRIP -->
  <div class="fader-strip" id="faderStrip">
    <!-- Generated by JS -->
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="footer-section">
      <span class="footer-label">Frames Per Second</span>
      <span class="footer-value good">60.0</span>
    </div>
    <div class="footer-sep"></div>
    <div class="footer-section">
      <span class="footer-label">DSP Load</span>
      <span class="footer-value">12%</span>
    </div>
    <div class="footer-sep"></div>
    <div class="footer-section">
      <span class="footer-label">GPU</span>
      <span class="footer-value">34%</span>
    </div>
    <div class="footer-sep"></div>
    <div class="footer-section">
      <span class="footer-label">Output</span>
      <span class="footer-value">Display 2 (1080p)</span>
    </div>
    <div class="footer-sep"></div>
    <div class="footer-section">
      <span class="footer-label">Syphon</span>
      <span class="footer-value good">Active</span>
    </div>
    <div class="footer-spacer"></div>
    <button class="footer-action rec on">Recording 02:34</button>
    <button class="footer-action">Snapshot</button>
    <button class="footer-action">Save</button>
    <button class="footer-action">Load</button>
  </div>

// ===== CLIP VISUALS =====
function drawClipVisual(canvas, colors, name) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, w, h);
  const seed = hashStr(name);
  const type = seed % 5;

  if (type === 0) {
    for (let c = 0; c < 3; c++) {
      ctx.beginPath();
      ctx.strokeStyle = colors[c];
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.8;
      const freq = 2 + (seed + c) % 4;
      const amp = 10 + (seed * (c + 1)) % 18;
      const offset = h / 2 + (c - 1) * 10;
      for (let x = 0; x < w; x++) {
        const y = offset + Math.sin(x * freq * 0.03 + c * 1.5) * amp;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if (type === 1) {
    const cx = w / 2, cy = h / 2;
    for (let i = 0; i < 16; i++) {
      const angle = (i / 16) * Math.PI * 2 + seed * 0.1;
      const r = 35 + (seed * i) % 18;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
      ctx.strokeStyle = colors[i % colors.length];
      ctx.lineWidth = 3;
      ctx.globalAlpha = 0.7;
      ctx.stroke();
    }
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 22);
    grad.addColorStop(0, colors[0]);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.5;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  } else if (type === 2) {
    ctx.globalAlpha = 0.6;
    const sz = 10 + seed % 8;
    for (let x = 0; x < w; x += sz) {
      for (let y = 0; y < h; y += sz) {
        const ci = ((x / sz | 0) + (y / sz | 0) + seed) % colors.length;
        const brightness = Math.sin(x * 0.05 + y * 0.07 + seed) * 0.5 + 0.5;
        if (brightness > 0.3) {
          ctx.fillStyle = colors[ci];
          ctx.globalAlpha = brightness * 0.6;
          ctx.fillRect(x + 1, y + 1, sz - 2, sz - 2);
        }
      }
    }
    ctx.globalAlpha = 1;
  } else if (type === 3) {
    ctx.globalAlpha = 0.7;
    for (let i = -h; i < w + h; i += 8) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.lineTo(i - h, h);
      ctx.strokeStyle = colors[(i / 8 | 0) % colors.length];
      ctx.lineWidth = 4;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else {
    for (let i = 0; i < 10; i++) {
      const cx = ((seed * 7 + i * 31) % w);
      const cy = ((seed * 13 + i * 17) % h);
      const r = 5 + (seed + i * 7) % 18;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, colors[i % colors.length]);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
